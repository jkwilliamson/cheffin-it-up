<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Details</title>
  <link rel="icon" href="https://fav.mhciael.com/👨‍🍳">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../style/style.css">
  <script src="https://cdn.jsdelivr.net/npm/i18next@23.11.0/dist/umd/i18next.min.js"></script>
  <script src="../js/mock_api.js"></script>
  <script src="../js/main.js"></script>
  <script src="recipe-viewer.js"></script>
</head>


<body>
  <nav class="nav-bar d-flex flex-sm-row flex-column align-items-center pe-sm-1">
    <h1 class="fs-4 m-0 fw-bold">Cheffin' It Up</h1>
    <a href="../" data-i18n="nav_home" class="nav-link text-white ms-sm-4">Home</a>
    <a href="search/" data-i18n="nav_search" class="nav-link text-white ms-sm-3">Recipe Search</a>
    <a href="../account/" id="username-nav-link" class="d-flex align-items-center justify-content-sm-end justify-content-center ms-sm-auto me-sm-2 m-0 nav-link text-white ">
      <span id="username-nav-name"></span>
      <img id="username-nav-img" class="rounded-circle ms-2 d-none" src="" height="30" width="30" alt="Profile picture">
    </a>
    <div class="ms-3">
      <button class="btn btn-sm btn-outline-light" onclick="changeLanguage('en')">EN</button>
      <button class="btn btn-sm btn-outline-light" onclick="changeLanguage('fr')">FR</button>
    </div>
  </nav>

  <main class="container py-4">
    <a href="../" data-i18n="back_home" class="btn btn-outline-secondary mb-4">← Back to Home</a>

    <header class="recipe-header">
      <div class="d-flex align-items-center justify-content-center mb-3">
        <h1 id="r-title" class="text-capitalize">Loading Recipe...</h1>
        <svg id="recipe-star" class="recipe-star rounded-circle ms-2 mb-1 p-1 d-none" width="48" height="48" fill="none" stroke="#0d6efd" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
        </svg>
      </div>
      
      <img id="r-img" src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif" alt="Loading..." class="main-img shadow-sm">
    </header>

    <section class="row mt-4">
      <div class="col-md-7">
        <h2 data-i18n="ingredients">Ingredients List</h2>
        <hr>
        <ul id="ingredient-list" class="list-group list-group-flush">
        </ul>
      </div>


      <div class="col-md-5">
        <h2 data-i18n="nutrition">Quick Nutrition</h2>
        <hr>
        <div class="stat-box">
          <strong data-i18n="calories">Calories</strong>
          <h2 id="r-cal" class="m-0 text-success">--</h2>
        </div>
        <div class="stat-box">
          <strong data-i18n="carbs">Carbs</strong>
          <h2 id="r-carbs" class="m-0 text-success">--</h2>
        </div>
        <div class="stat-box">
          <strong data-i18n="protein">Protein</strong>
          <h2 id="r-protein" class="m-0 text-success">--</h2>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>


</html>
