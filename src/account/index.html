<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheffin' It Up - Dashboard</title>
  <link rel="icon" href="https://fav.mhciael.com/👨‍🍳">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../style/style.css">
  <script src="https://cdn.jsdelivr.net/npm/i18next@23.11.0/dist/umd/i18next.min.js"></script>
  <script src="../js/mock_api.js"></script>
  <script src="../js/main.js"></script>
  <script src="account-dashboard.js"></script>
</head>


<body>
  <nav class="nav-bar d-flex flex-sm-row flex-column align-items-center pe-sm-1">
    <h1 class="fs-4 m-0 fw-bold">Cheffin' It Up</h1>
    <a href="../" data-i18n="nav_home" class="nav-link text-white ms-sm-4">Home</a>
    <a href="../recipe/search/" data-i18n="nav_search" class="nav-link text-white ms-sm-3">Recipe Search</a>
    <a href="./" id="username-nav-link" class="d-flex align-items-center justify-content-sm-end justify-content-center ms-sm-auto me-sm-2 m-0 nav-link text-white ">
      <span id="username-nav-name"></span>
      <img id="username-nav-img" class="rounded-circle ms-2 d-none" src="" height="30" width="30" alt="Profile picture">
    </a>
    <div class="ms-3">
      <button class="btn btn-sm btn-outline-light" onclick="changeLanguage('en')">EN</button>
      <button class="btn btn-sm btn-outline-light" onclick="changeLanguage('fr')">FR</button>
    </div>
  </nav>

  <main class="container mt-5">
    <div class="row flex-column m-0">

      <h1 class="text-center" data-i18n="user-dashboard">User Dashboard</h1>

      <form id="login-box" class="m-3 p-4 bg-light rounded shadow-sm mx-auto">
        <h2 class="fs-4" data-i18n="login_head">Login</h2>

        <label for="username-input" class="visually-hidden" data-i18n="username">Username</label>
        <input 
          type="text" 
          id="username-input" 
          data-i18n="[placeholder]search_placeholder"
          class="form-control mt-3" 
          placeholder="Username" 
          autocomplete="username" 
          required
        >
        <p id="username-error" class="text-danger small ms-2 mt-2 d-none"></p>

        <label for="password-input" class="visually-hidden" data-i18n="password">Password</label>
        <input 
          type="password" 
          id="password-input" 
          data-i18n="[placeholder]password_placeholder"
          class="form-control mt-3" 
          autocomplete="current-password" 
          pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{6,}" 
          required
        >
        <p id="password-error" class="text-danger small ms-2 mt-2 d-none"></p>
        
        <div id="password-criteria" class="bg-white rounded p-3 mt-3 d-none">
          <p class="small" data-i18n="genuine"></p>

          <img id="criteria-length" alt="invalid" src="../img/x-square.svg">
          <span data-i18n="char">6 characters long</span>
          <br>

          <img id="criteria-lowercase" alt="invalid" src="../img/x-square.svg">
          <span data-i18n="lower">a lowercase letter</span>
          <br>

          <img id="criteria-uppercase" alt="invalid" src="../img/x-square.svg">
          <span data-i18n="upper">an uppercase letter</span>
          <br>

          <img id="criteria-digit" alt="invalid" src="../img/x-square.svg">
          <span data-i18n="digit">a digit</span>
          <br>

          <img id="criteria-special" alt="invalid" src="../img/x-square.svg">
          <span data-i18n="special">a special character</span>
          
        </div>

        <button id="login-btn" data-i18n="signin_btn" class="btn btn-success w-100 mt-3" type="submit">Sign In</button>
      </form>

      <section id="welcome-box" class="mx-auto my-3 p-4 bg-success text-white rounded shadow d-none">
        <h2 id="user-display" data-i18n="welcome_head" class="m-0">Welcome</h2>
        <p class="mt-2 text-white" data-i18n="cooking_prompt">What are we cooking today?</p>
        <div class="d-flex align-items-center justify-content-end">
          <span class="text-white me-2" data-i18n="not_you">Not you?</span>
          <button id="logout-btn" data-i18n="logout" class="btn btn-light">Logout</button>
        </div>
        <hr>
        <h3 class="mt-3" data-i18n="quick">Quick Preferences</h3>
        <div class="d-flex align-items-center mt-3">
          <label for="pref-diet" class="form-label mt-2 ms-2 me-3 fw-bold" data-i18n="diet">Diet</label>
          <select id="pref-diet" class="form-select form-select-sm shadow-sm w-50">
            <option value="">Any</option>
            <option value="balanced">Balanced</option>
            <option value="high-protein">High Protein</option>
            <option value="low-carb">Low Carb</option>
            <option value="low-fat">Low Fat</option>
          </select>
        </div>
      </section>

      <span id="empty-message">
        <span data-i18n="favorite">No favorites found, </span>
        <a href="../recipe/search/" data-i18n="find_link" class="fw-bold">find</a>
        <span data-i18n="fav"> some recipes!</span>
      </span>

      <section id="favorites" class="" aria-hidden="false">
        <h2 class="mt-3" data-i18n="favorites">Favorites</h2>

        <table class="table">
          <thead>
            <tr>
              <th data-i18n="name">Name</th>
              <th data-i18n="time">Time</th>
              <th>Calories</th>
            </tr>
          </thead>
          <tbody id="favorites-tbody">
            
          </tbody>
        </table>
      </section>

    </div>
  </main>
  
  <template id="row-template">
    <tr class="text-capitalize recipe-row" role="link" data-recipe-id="">
      <td class="fw-bold"></td>
      <td></td>
      <td></td>
    </tr>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>


</html>
